# render.yaml - Render Blueprint specification for Medicare Full Stack Application
# Deploys: PostgreSQL Database, Node.js Backend API, and React Frontend Static Site

services:
  # 1. Backend Web Service
  - type: web
    name: medicare-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medicare-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: medicare-frontend
          property: url

  # 2. Frontend Static Web App
  - type: web
    name: medicare-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: medicare-backend
          property: url
          path: /api

databases:
  # 3. PostgreSQL Database
  - name: medicare-db
    databaseName: medicare
    user: postgres
    plan: free
